name: 🩺 Parser Health Check

on:
  schedule:
    # Executa toda segunda-feira às 08:00 UTC
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  health-check:
    name: 🩺 Verificar Saúde do Parser
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 📥 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "."
          playwright install chromium --with-deps

      - name: 🐦 Canary Test — Buscar termo de referência
        id: canary
        run: |
          # Buscar um termo "canário" que sempre deve retornar resultados
          python -m harness.run_harness \
            --terms "python programming language" \
            --output results/canary/ \
            --max-retries 2 \
            --log-level DEBUG
        continue-on-error: true

      - name: 📊 Analisar Resultados do Canary
        id: analyze
        if: always()
        run: |
          python -c "
          import json, sys
          from pathlib import Path

          results_dir = Path('results/canary')
          summaries = sorted(results_dir.glob('summary_*.json'), reverse=True)
          
          if not summaries:
              print('❌ Nenhum sumário encontrado')
              with open('$GITHUB_OUTPUT', 'a') as f:
                  f.write('parser_healthy=false\n')
                  f.write('failure_reason=Nenhum sumário gerado\n')
              sys.exit(0)
          
          summary = json.loads(summaries[0].read_text())
          success_rate = summary['metrics']['success_rate']
          total_results = summary['metrics']['total_results']
          
          print(f'Taxa de sucesso: {success_rate:.1%}')
          print(f'Total de resultados: {total_results}')
          
          healthy = success_rate >= 0.8 and total_results >= 5
          
          with open('$GITHUB_OUTPUT', 'a') as f:
              f.write(f'parser_healthy={str(healthy).lower()}\n')
              if not healthy:
                  f.write(f'failure_reason=Taxa: {success_rate:.1%}, Resultados: {total_results}\n')
          " 2>/dev/null || echo "parser_healthy=false" >> $GITHUB_OUTPUT

      - name: 🚨 Criar Issue se Parser Quebrado
        if: steps.canary.outcome == 'failure' || steps.analyze.outputs.parser_healthy == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const reason = '${{ steps.analyze.outputs.failure_reason }}' || 'Canary test falhou';
            
            // Verificar se já existe issue aberta
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'agent-task,parser-broken',
              state: 'open',
            });
            
            if (issues.data.length > 0) {
              console.log('Issue já existe:', issues.data[0].number);
              
              // Adicionar comentário com novo resultado
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues.data[0].number,
                body: `🩺 **Health Check Update** (${new Date().toISOString()})\n\nParser continua falhando.\n- Motivo: ${reason}\n- Run: ${context.runId}`,
              });
              return;
            }
            
            // Criar nova issue
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Parser quebrado: seletores CSS desatualizados',
              labels: ['agent-task', 'parser-broken', 'priority-high'],
              body: [
                '## Problema',
                '',
                'O health check semanal detectou que o parser do WebScrapper não está extraindo resultados corretamente.',
                '',
                `**Motivo**: ${reason}`,
                `**Run ID**: ${context.runId}`,
                `**Data**: ${new Date().toISOString()}`,
                '',
                '## Ação Necessária',
                '',
                'Usar a skill `update-parser` para:',
                '1. Baixar HTML de referência atualizado',
                '2. Identificar novos seletores CSS',
                '3. Atualizar `src/parser.py`',
                '4. Atualizar fixtures de teste',
                '5. Rodar testes e validar',
                '',
                '## Contexto',
                '',
                'O Google frequentemente altera o layout da SERP. Os seletores CSS em `src/parser.py` precisam ser atualizados.',
              ].join('\n'),
            });

      - name: ✅ Parser Saudável
        if: steps.analyze.outputs.parser_healthy == 'true'
        run: echo "✅ Parser está saudável! Canary test passou."
